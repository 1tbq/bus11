<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

  --green: #2f8f52;

  --amber: #cf8f10;
  min-height: 100vh;

  color: var(--ink);

  padding-bottom: 64px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.015em; margin: 0; line-height: 1.08; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* header: application masthead */
.mast { background: var(--ink); color: #eef1f6; border-bottom: 4px solid var(--amber); }
.mast-in { max-width: 960px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.mast .who { margin-right: auto; }
.mast .who .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #9aa6c4; }

.field { text-align: right; }
.field .lab { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa6c4; }
.field .val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px; color: #fff; }
.field .val.hot { color: var(--amber); }

/* approval board */
.board { max-width: 960px; margin: 0 auto; padding: 16px 18px 0; }
.board-in { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--rule); padding: 12px 14px; }
.lamp { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.dot { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--red); background: transparent; flex: none; }
.lamp.now .dot { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 0 4px rgba(207,143,16,0.16); }
.lamp.ok .dot { border-color: var(--green); background: var(--green); }
.lamp .nm { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); text-align: center; line-height: 1.25; }
.lamp.ok .nm { color: var(--green); }
.lamp.now .nm { color: var(--ink); font-weight: 600; }

.wrap { max-width: 960px; margin: 0 auto; padding: 16px 18px 0; }

/* form card */
.form { background: var(--card); border: 1px solid var(--rule); animation: fade 300ms ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.form-head { padding: 15px 22px 14px; border-bottom: 1px solid var(--rule); background: linear-gradient(180deg, #f7f9f5, #fff); }
.form-head .code { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soft); display: block; margin-bottom: 7px; }
.form-head h2 { font-size: 25px; }
.form-head p { margin: 6px 0 0; font-size: 13.5px; color: var(--soft); max-width: 58ch; }
.form-body { padding: 22px; }
.form-foot { padding: 12px 22px; border-top: 1px solid var(--rule); background: #f7f9f5; display: flex; gap: 14px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--soft); letter-spacing: 0.05em; }

.btn { border: none; border-radius: 2px; padding: 12px 22px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 14.5px; transition: transform 90ms ease, filter 120ms ease; }
.btn:active { transform: translateY(1px); }
.btn-go { background: var(--ink); color: #fff; }
.btn-go:hover:not(:disabled) { background: var(--ink2); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn-ghost:hover { background: rgba(22,32,58,0.06); }
.btn-lite { background: var(--amber); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.opts { display: grid; gap: 8px; }
.opt { width: 100%; text-align: left; background: #fbfcfa; color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; padding: 13px 15px; font-size: 14.5px; line-height: 1.45; display: flex; gap: 12px; align-items: flex-start; transition: border-color 110ms, background 110ms; }
.opt:hover:not(:disabled) { border-color: var(--ink); background: #fff; }
.opt .key { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; background: var(--rule2); color: var(--soft); border-radius: 2px; padding: 3px 7px; flex: none; margin-top: 1px; }
.opt.right { border-color: var(--green); border-width: 2px; background: var(--green-bg); }
.opt.right .key { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); border-width: 2px; background: var(--red-bg); }
.opt.wrong .key { background: var(--red); color: #fff; }
.opt.sel { border-color: var(--blue); border-width: 2px; background: #eef2fd; }
.opt.sel .key { background: var(--blue); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #fbfcfa; border: 1px solid var(--rule); border-radius: 2px; padding: 10px 15px; font-size: 13.5px; color: var(--ink); font-weight: 500; }
.chip:hover:not(:disabled) { border-color: var(--ink); background: #fff; }
.chip.right { border-color: var(--green); border-width: 2px; background: var(--green-bg); }
.chip.wrong { border-color: var(--red); border-width: 2px; background: var(--red-bg); }

.stamp { display: inline-block; transform: rotate(-4deg); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.14em; padding: 7px 15px; border: 2.5px solid currentColor; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px currentColor; animation: bang 250ms cubic-bezier(.2,1.6,.4,1); }
@keyframes bang { from { transform: rotate(-4deg) scale(1.6); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.stamp.ok { color: var(--green); }
.stamp.no { color: var(--red); }

.fb { margin-top: 16px; padding: 14px 16px; background: #f4f7f2; border: 1px solid var(--rule); border-left: 4px solid var(--ink); font-size: 14px; color: #333e5c; }
.fb strong { color: var(--ink); }
.meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--soft); }
.q { font-size: 18.5px; font-weight: 700; line-height: 1.36; margin: 0 0 16px; font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.012em; }
.item { background: #fbfcfa; border: 1px solid var(--rule); border-left: 5px solid var(--amber); padding: 18px 20px; font-size: 17px; line-height: 1.42; margin-bottom: 16px; font-weight: 500; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { padding: 20px 16px; border: 2px solid var(--ink); background: #fbfcfa; border-radius: 2px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 5px; align-items: center; text-align: center; line-height: 1.15; }
.bin span { font-family: 'Instrument Sans', sans-serif; font-weight: 400; font-size: 12px; color: var(--soft); line-height: 1.35; }
.bin:hover:not(:disabled) { background: var(--ink); color: #fff; }
.bin:hover:not(:disabled) span { color: #c3ccdf; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule2); vertical-align: top; }
.tbl th { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--soft); border-bottom: 1px solid var(--rule); }
.tbl td.num { font-family: 'IBM Plex Mono', monospace; }
.box { background: #fbfcfa; border: 1px solid var(--rule); padding: 14px 16px; margin-bottom: 10px; }
.ta { width: 100%; min-height: 260px; resize: vertical; padding: 15px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; color: var(--ink); font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.65; }
.inp { padding: 11px 13px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; color: var(--ink); font-size: 14.5px; font-family: inherit; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: #fbfcfa; border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 8px; font-size: 14px; text-align: left; width: 100%; color: var(--ink); line-height: 1.45; }
.chk.on { border-color: var(--green); border-width: 2px; background: var(--green-bg); }
.chk .sq { width: 20px; height: 20px; flex: none; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-top: 1px; }
.chk.on .sq { background: var(--green); border-color: var(--green); color: #fff; }
.ord { display: flex; gap: 10px; align-items: flex-start; background: #fbfcfa; border: 1px solid var(--rule); border-radius: 2px; padding: 11px 13px; margin-bottom: 8px; font-size: 14px; }
.ord.right { border-color: var(--green); border-width: 2px; background: var(--green-bg); }
.ord.wrong { border-color: var(--red); border-width: 2px; background: var(--red-bg); }
.ordb { display: flex; flex-direction: column; gap: 3px; flex: none; }
.ordb button { width: 26px; height: 20px; border: 1px solid var(--rule); background: #fff; border-radius: 2px; font-size: 11px; line-height: 1; color: var(--ink); }
.ordb button:hover:not(:disabled) { background: var(--amber); }
.ordn { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; color: var(--soft); flex: none; margin-top: 3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: #fbfcfa; border: 1px solid var(--rule); padding: 14px; }
.stat .k { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
.stat .v { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; margin-top: 2px; }
.bar { height: 8px; background: var(--rule2); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; background: var(--green); }
.tag { display: inline-block; background: var(--ink); color: #fff; padding: 6px 13px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; margin: 0 6px 6px 0; }
.note { font-size: 13px; color: var(--soft); }
.rowb { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.seal { border: 3px double var(--ink); padding: 18px 20px; text-align: center; margin-bottom: 20px; background: #fbfcfa; }
.seal .k { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--soft); }
.seal h3 { font-size: 27px; margin: 6px 0 4px; }
.seal p { margin: 0; font-size: 13.5px; color: var(--soft); }
details.teach { background: var(--ink); border: 1px solid var(--ink); padding: 14px 16px; margin-top: 16px; color: #eef1f6; }
details.teach summary { cursor: pointer; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px; }
details.teach ul { margin: 12px 0 0; padding-left: 20px; font-size: 13.5px; color: #c3ccdf; }
details.teach li { margin-bottom: 6px; }

@media (max-width: 640px) {
  .bins { grid-template-columns: 1fr; }
  .form-head h2 { font-size: 21px; }
  .form-body { padding: 16px; }
  .lamp .nm { display: none; }
  .field .val { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<body>

<div class="mast">
  <div class="mast-in">
    <div class="who">
      <div class="eyebrow">Application to trade</div>
      <div class="title">Sambal Sisters &mdash; mobile food premises</div>
    </div>
    <div class="field"><div class="lab">Score</div><div class="val hot" id="gScore">0</div></div>
    <div class="field"><div class="lab">Section</div><div class="val" id="gRound">-</div></div>
    <div class="field"><div class="lab">Elapsed</div><div class="val mono" id="gTime">00:00</div></div>
  </div>
</div>
<div id="board"></div>
<div class="wrap"><div id="app"></div></div>

<script>
"use strict";

var BUSINESS = "Sambal Sisters";
var KEYS = ["A","B","C","D","E"];

/* ============ ROUND 1: registration run ============ */
var SPRINT = [
 {q:"An Australian Business Number (ABN) is:",
  o:["a paid licence issued by the local council",
     "a free identifier applied for through the Australian Business Register, used in dealings with the ATO and other businesses",
     "the same thing as a company name",
     "only available to businesses with more than five employees"],
  a:1, why:"An ABN is free and comes from the Australian Business Register. Without one, other businesses must withhold tax from payments they make to you, and you cannot register for GST."},
 {q:"The sisters want to trade as Sambal Sisters rather than under their own legal names. What must they do?",
  o:["Nothing, any name can be used freely",
     "Register the business name with ASIC",
     "Register the name with WorkSafe Victoria",
     "Apply to the ATO for a company name"],
  a:1, why:"Business names are registered with ASIC. You only avoid this if you trade under your own legal name. Registering a business name is not the same as owning a trade mark."},
 {q:"A business must register for GST once its annual turnover reaches:",
  o:["$30,000","$50,000","$75,000","$150,000"],
  a:2, why:"The threshold is $75,000 of current or projected annual turnover, and registration must happen within 21 days of becoming aware you will cross it."},
 {q:"Before selling a single serve of food in Victoria, a mobile food van must:",
  o:["obtain Food Act 1984 registration from its registering council",
     "join an industry association",
     "lodge a business plan with the state government",
     "employ a qualified chef"],
  a:0, why:"Every food premises in Victoria, fixed or mobile, needs Food Act registration from its registering council before it can sell food."},
 {q:"Victorian mobile and temporary food premises apply for that registration through:",
  o:["myGov","the FoodTrader portal, previously called Streatrader","the Australian Business Register","Fair Work Online"],
  a:1, why:"FoodTrader is the statewide Department of Health portal for registering mobile and temporary food premises. Older textbooks still call it Streatrader."},
 {q:"A Statement of Trade is:",
  o:["a summary of profit and loss for the ATO",
     "a notice telling each relevant council where and when you plan to trade in their area",
     "a contract with a supplier",
     "a permit to employ casual staff"],
  a:1, why:"You lodge a Statement of Trade for every council area you intend to trade in. It can only be lodged after your registration has been granted, so you cannot trade while an application is pending."},
 {q:"Sambal Sisters will handle high-risk foods needing temperature control, making it a class 2 premises. This means they must:",
  o:["nominate a food safety supervisor","hire a minimum of three staff","register with ASIC as a company","pay payroll tax from day one"],
  a:0, why:"Class 2 premises must nominate a food safety supervisor who holds the required competencies and oversees food handling."},
 {q:"Once Sambal Sisters employs its first casual staff member in Victoria, it must:",
  o:["take out WorkCover insurance through WorkSafe Victoria",
     "register the employee with ASIC",
     "apply for a new ABN",
     "join a union"],
  a:0, why:"Employing staff triggers WorkCover insurance obligations with WorkSafe Victoria, along with PAYG withholding, super and record keeping duties."},
 {q:"From 1 July 2026, employer superannuation contributions must be:",
  o:["paid once a year at tax time","paid quarterly as before","paid on each payday under the Payday Super rules","paid only to full-time staff"],
  a:2, why:"Payday Super began on 1 July 2026. Contributions must now be paid at the same time as wages, at the 12 per cent super guarantee rate."},
 {q:"Advertising the van's rendang as 'locally sourced' when the beef is imported would most likely breach:",
  o:["the Food Act 1984","the Australian Consumer Law under the Competition and Consumer Act 2010","the Fair Work Act 2009","the Privacy Act 1988"],
  a:1, why:"False or misleading claims about goods breach the Australian Consumer Law. The ACCC and Consumer Affairs Victoria both enforce it, and penalties are substantial."}
];

/* ============ ROUND 2: who do you call ============ */
var PROS = ["Accountant","Solicitor","Bank manager","Business adviser","Insurance broker","IT specialist","Marketing consultant"];

var PRO_ITEMS = [
 {t:"Setting up a chart of accounts and a schedule for lodging the quarterly BAS.", a:0,
  why:"Accountant. Tax compliance, GST reporting and the design of the record keeping system are core accounting work."},
 {t:"Drafting the written partnership agreement that sets out each sister's share of profit and what happens if one leaves.", a:1,
  why:"Solicitor. A partnership agreement is a legal document, and getting it wrong is one of the most common causes of partnership disputes."},
 {t:"Comparing a five year secured loan for the van against a finance lease, and arranging the facility.", a:2,
  why:"Bank manager. Structuring and approving finance, and matching the product to the asset, sits with the lender."},
 {t:"Working out the right level of public liability and product liability cover for trading at public markets.", a:4,
  why:"Insurance broker. A broker assesses the specific risks of the business and compares policies and exclusions across insurers."},
 {t:"Choosing a point of sale system that keeps taking payments when mobile reception at a market drops out.", a:5,
  why:"IT specialist. System selection, offline capability, data backup and security are technology decisions."},
 {t:"Testing whether the break-even figures in the business plan are realistic before the sisters commit their savings.", a:3,
  why:"Business adviser. Advisers and consultants challenge the assumptions in a plan and bring experience of comparable businesses."},
 {t:"Registering a trade mark over the business name and logo so a competitor cannot copy it.", a:1,
  why:"Solicitor. Intellectual property registration and enforcement is legal work. Registering a business name with ASIC does not give you ownership of it."},
 {t:"Arranging an overdraft facility so wages can still be paid in a slow fortnight.", a:2,
  why:"Bank manager. Overdrafts and other short term facilities are negotiated with the bank."},
 {t:"Identifying which suburbs and events have the strongest demand, and shaping the launch campaign.", a:6,
  why:"Marketing consultant. Market research, target market definition and promotion planning are marketing work."},
 {t:"Deciding whether operating as a partnership or a company would leave the sisters better off after tax.", a:0,
  why:"Accountant. The tax consequences of a business structure are an accounting question, even though the paperwork to set it up may involve a solicitor."},
 {t:"Reading the exclusions in the van's proposed policy to check whether a fire caused by the deep fryer would be covered.", a:4,
  why:"Insurance broker. Interpreting cover and exclusions before signing is exactly what a broker is engaged for."},
 {t:"Building a secure system for storing customer contact details collected through the online ordering form.", a:5,
  why:"IT specialist. Data security and privacy compliance in the systems themselves is a technology responsibility."}
];

/* ============ ROUND 3: required or recommended ============ */
var SORT_ITEMS = [
 {t:"Obtaining Food Act registration from the registering council before the first day of trade.", cat:"req",
  why:"Legally required. Selling food without registration is an offence under the Food Act 1984."},
 {t:"Opening a separate bank account for the business rather than using a personal account.", cat:"rec",
  why:"Strongly recommended rather than legally required for a partnership, but without it the records become unreliable and the BAS almost impossible to substantiate. A company must keep its funds separate."},
 {t:"Lodging a Statement of Trade with every council the van will operate in.", cat:"req",
  why:"Legally required. Trading in a council area without a lodged Statement of Trade risks a fine."},
 {t:"Engaging a business mentor from a local business network.", cat:"rec",
  why:"Strongly recommended. Valuable support, but no law requires it."},
 {t:"Registering for GST once projected annual turnover reaches $75,000.", cat:"req",
  why:"Legally required. Miss the 21 day window and the ATO can backdate registration, leaving the business to pay GST out of revenue it has already received."},
 {t:"Taking out public liability insurance.", cat:"rec",
  why:"Strictly speaking not required by law, so this belongs under recommended. In practice it is unavoidable, because councils and event organisers almost always make it a condition of the permit or contract."},
 {t:"Nominating a food safety supervisor for a class 2 premises.", cat:"req",
  why:"Legally required for class 2 premises under the Food Act."},
 {t:"Buying cloud accounting software that links to the bank feed.", cat:"rec",
  why:"Strongly recommended. The law requires records to be kept and retained, not any particular software."},
 {t:"Taking out WorkCover insurance once staff are employed.", cat:"req",
  why:"Legally required in Victoria through WorkSafe once the business employs and pays workers."},
 {t:"Preparing a written business plan before approaching the bank.", cat:"rec",
  why:"Strongly recommended, and usually demanded by a lender, but not a legal requirement."},
 {t:"Keeping business records and retaining them for the period the ATO requires.", cat:"req",
  why:"Legally required. Record keeping obligations sit under tax law, and penalties apply for failing to meet them."},
 {t:"Running a trade mark search before printing the van's signage.", cat:"rec",
  why:"Strongly recommended. Not compulsory, but far cheaper than rebranding after a letter of demand arrives."}
];

/* ============ ROUND 4: fund the van ============ */
var COSTS = [
 {item:"Van purchase and food-grade fit-out", amt:"$58,000", life:"7 years"},
 {item:"Cooking equipment and refrigeration", amt:"$14,000", life:"5 years"},
 {item:"Opening stock and packaging", amt:"$4,000", life:"Weeks"},
 {item:"Registrations, permits and insurance", amt:"$6,000", life:"1 year"},
 {item:"Working capital buffer", amt:"$10,000", life:"Ongoing"}
];

var FIN_DECISIONS = [
 {q:"The sisters put in $30,000 of their own savings. How is that source of finance classified, and why does the distinction matter?",
  o:["Debt finance, because the money has to be repaid",
     "Equity finance, because it is the owners' own funds and carries no repayment obligation or interest",
     "Debt finance, because the bank is involved",
     "Neither, because personal savings are not a source of business finance"],
  pts:[0,20,0,0], a:1,
  why:"Equity is funding contributed by the owners. It carries no interest and no repayment schedule, but it puts the owners' own money at risk and, if outside investors are brought in, dilutes ownership."},
 {q:"They still need $58,000 for the van, an asset with a seven year working life. Which source suits that need best?",
  o:["A bank overdraft",
     "A credit card",
     "A secured term loan or finance lease repaid over the van's useful life",
     "Trade credit from the food supplier"],
  pts:[0,0,20,5], a:2,
  why:"Match the term of the finance to the life of the asset. A long-life asset is funded with long-term finance, and securing the loan against the van itself usually brings a lower interest rate."},
 {q:"Choose the TWO strongest reasons for matching the term of the finance to the life of the asset. Select two.",
  multi:2,
  o:["Repayments are spread across the years in which the asset actually earns revenue",
     "Short-term facilities can be withdrawn or repriced, which would leave the business unable to fund an asset it still needs",
     "Long-term finance is always cheaper in total interest than short-term finance",

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(x){ return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
function totalPoints(){ return ROUNDS.reduce(function(s,r){ return s+((S.results[r.id]&&S.results[r.id].points)||0); },0); }
function shuffle(arr){
 var a=arr.slice();
 for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
 if (a.every(function(v,i){ return v===arr[i]; })){ var t2=a[0]; a[0]=a[1]; a[1]=t2; }
 return a;
}

function mcq(opts,picked,answer,act){
 return '<div class="opts">'+opts.map(function(o,i){

   '<span class="key">'+KEYS[i]+'</span><span>'+esc(o)+'</span></button>';
 }).join("")+'</div>';
}

   '<span>SCORE '+st.pts+'</span>');
 }
 var words = st.essay.trim() ? st.essay.trim().split(/\s+/).length : 0;
 var checks = RUBRIC.map(function(r,i){
  var on = st.rubric.indexOf(i)>-1;
  return '<button class="chk'+(on?" on":"")+'" data-act="wr-rubric" data-i="'+i+'">'+
   '<span class="sq">'+(on?"&#10003;":"")+'</span><span>'+esc(r)+'</span></button>';
 }).join("");
 var body2 = '<div class="item" style="font-size:15px">Analyse the role of <strong>two</strong> external professionals in helping '+
  BUSINESS+' meet its legal and financial requirements when establishing the business. Refer to specific requirements throughout.</div>'+
  '<textarea class="ta" id="essay" placeholder="Start by defining the first professional, then apply them to Sambal Sisters...">'+esc(st.essay)+'</textarea>'+
  '<div class="meta" style="margin:18px 0 10px">Self-check. Ten points for each statement you can honestly tick. Your teacher can see this response.</div>'+
  checks+
  '<div style="margin-top:18px"><button class="btn btn-go" id="submitBtn" data-act="wr-finish"'+(words<40?" disabled":"")+'>'+
  (words<40?"Write at least 40 words to submit":"Submit and see the decision")+'</button></div>';
 return form("Section 6 / written task","Your analysis",
  "Ten minutes. Two professionals. Write it as you would under SAC conditions.", body2,
  '<span>WORDS <b id="wordcount">'+words+'</b></span>');
}

function viewResults(){
 var total=totalPoints(), ratio=total/TOTAL_MAX;
 var tier = TIERS.find(function(t){ return ratio>=t.min; });
 var w = S.results.write || {};
 var tags=[];
 if ((S.results.sprint||{}).best>=5) tags.push("Five in a row");
 if (S.results.pros && S.results.pros.correct===S.results.pros.of) tags.push("Every professional matched");
 if (S.results.sort && S.results.sort.correct===S.results.sort.of) tags.push("Knew the traps");
 if (S.results.cases && S.results.cases.correct>=10) tags.push("All notices answered");
 if (w.words>=250) tags.push("Full response written");
 if (S.elapsed<=45*60 && ratio>=0.7) tags.push("Lodged early");

 var body = '<div class="seal"><div class="k">Determination</div><h3>'+esc(tier.name)+'</h3><p>'+esc(tier.note)+'</p></div>'+
  '<div class="grid" style="margin-bottom:20px">'+
   '<div class="stat"><div class="k">Total score</div><div class="v">'+total+' <span style="font-size:15px;color:var(--soft)">/ '+TOTAL_MAX+'</span></div></div>'+
   '<div class="stat"><div class="k">Percentage</div><div class="v">'+Math.round(ratio*100)+'%</div></div>'+
   '<div class="stat"><div class="k">Time on task</div><div class="v mono">'+fmt(S.elapsed)+'</div></div>'+
  '</div>'+
  '<div class="meta" style="margin-bottom:10px">Section by section</div>'+
  ROUNDS.map(function(r){
   var p=(S.results[r.id]&&S.results[r.id].points)||0;
   return '<div style="margin-bottom:12px"><div class="rowb"><span>'+esc(r.full)+'</span><span class="mono">'+p+' / '+r.max+'</span></div>'+
    '<div class="bar"><i style="width:'+Math.min(100,(p/r.max)*100)+'%"></i></div></div>';
  }).join("");
 if (tags.length){
  body += '<div class="meta" style="margin:20px 0 10px">Endorsements</div><div>'+
   tags.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("")+'</div>';
 }
 if (w.essay){
  body += '<div class="meta" style="margin:20px 0 8px">Your written response ('+w.words+' words, '+w.rubric+' of '+RUBRIC.length+' self-checks)</div>'+
   '<div class="box" style="white-space:pre-wrap;font-size:14px;line-height:1.6">'+esc(w.essay)+'</div>'+
   '<p class="note">Copy this into your workbook before you close the page. Nothing here is saved.</p>';
 }
 body += '<div class="meta" style="margin:24px 0 10px">Class board</div>'+
  '<p class="note" style="margin-top:0">This board lives on this device for this session only. Refreshing clears it.</p>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
   '<input class="inp" id="nameinp" placeholder="Your name" value="'+esc(S.res.name)+'" style="flex:1;min-width:180px">'+
   '<button class="btn btn-lite" data-act="res-add"'+(S.res.added?" disabled":"")+'>'+(S.res.added?"Added":"Add my score")+'</button></div>';
 if (S.board.length){
  body += '<table class="tbl"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody>'+
   S.board.slice().sort(function(a,b){ return b.total-a.total; }).map(function(b,i){
    return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(b.name)+'</td><td class="num">'+b.total+
     '</td><td class="num">'+b.pct+'%</td><td class="num">'+fmt(b.time)+'</td></tr>';
   }).join("")+'</tbody></table>';
 }
 body += '<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">'+
  '<button class="btn btn-go" data-act="res-copy">'+(S.res.copied?"Copied":"Copy my result")+'</button>'+
  '<button class="btn btn-ghost" data-act="res-restart">Run it again</button></div>';

 return form("Determination / all sections closed","Application determined", "", body);
}

/* ====================== RENDER ====================== */
function renderBoard(){
 var el=document.getElementById("board");
 if (S.stage==="intro"){ el.innerHTML=""; return; }
 el.innerHTML = '<div class="board"><div class="board-in">'+ROUNDS.map(function(r,i){
  var c = (i<S.ri || S.stage==="done") ? "ok" : (i===S.ri && S.stage==="run" ? "now" : "");
  return '<div class="lamp '+c+'"><span class="dot"></span><span class="nm">'+esc(r.name)+'</span></div>';
 }).join("")+'</div></div>';
}
function renderFields(){
 document.getElementById("gScore").textContent = totalPoints();
 document.getElementById("gRound").textContent = S.stage==="run" ? (S.ri+1)+"/6" : (S.stage==="done" ? "6/6" : "-");
 document.getElementById("gTime").textContent = fmt(S.elapsed);
}
function render(){
 var html;
 if (S.stage==="intro") html=viewIntro();
 else if (S.stage==="done") html=viewResults();
 else {
  var id=ROUNDS[S.ri].id;
  html = id==="sprint"?viewSprint() : id==="pros"?viewPros() : id==="sort"?viewSort()
       : id==="fin"?viewFin() : id==="cases"?viewCases() : viewWrite();
 }
 document.getElementById("app").innerHTML = html;
 renderBoard(); renderFields(); bindEssay();
}
function bindEssay(){
 var ta=document.getElementById("essay");
 if (!ta) return;
 ta.addEventListener("input", function(){
  S.wr.essay = ta.value;
  var n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
  var wc=document.getElementById("wordcount"); if (wc) wc.textContent=n;
  var b=document.getElementById("submitBtn");
  if (b){ b.disabled = n<40; b.textContent = n<40 ? "Write at least 40 words to submit" : "Submit and see the decision"; }
 });
}

/* ====================== TIMERS ====================== */
function startElapsed(){
 if (elapsedTimer) return;
 elapsedTimer = setInterval(function(){
  S.elapsed++;
  var el=document.getElementById("gTime"); if (el) el.textContent=fmt(S.elapsed);
 },1000);
}
function stopElapsed(){ clearInterval(elapsedTimer); elapsedTimer=null; }
function startSprintClock(){
 stopSprintClock();
 sprintTimer = setInterval(function(){
  if (S.sp.picked!==null){ stopSprintClock(); return; }
  S.sp.left--;
  if (S.sp.left<=0){ stopSprintClock(); S.sp.picked=-1; S.sp.streak=0; S.sp.bonus=0; render(); return; }
  var el=document.getElementById("spclock");
  if (el){ el.textContent=S.sp.left+"s"; if (S.sp.left<=5) el.style.color="var(--red)"; }
 },1000);
}
function stopSprintClock(){ clearInterval(sprintTimer); sprintTimer=null; }

function finishRound(id,payload){
 S.results[id]=payload;
 if (S.ri+1>=ROUNDS.length){ S.stage="done"; stopElapsed(); } else { S.ri++; }
 render();
 if (S.stage==="run" && ROUNDS[S.ri].id==="sprint") startSprintClock();
}

/* ====================== EVENTS ====================== */
document.getElementById("app").addEventListener("click", function(e){
 var btn = e.target.closest("[data-act]");
 if (!btn || btn.disabled) return;
 var act = btn.getAttribute("data-act");
 var i = parseInt(btn.getAttribute("data-i"),10);

 if (act==="start"){ S.stage="run"; startElapsed(); render(); startSprintClock(); return; }

 if (act==="sp-ans"){
  var a=S.sp, q=SPRINT[a.i];
  if (a.picked!==null) return;
  stopSprintClock();
  var ok = i===q.a;
  a.bonus = ok ? Math.min(4, Math.ceil(a.left/5)) : 0;
  if (ok){ a.pts += 10+a.bonus; a.correct++; a.streak++; a.best=Math.max(a.best,a.streak); } else a.streak=0;
  a.picked=i; render(); return;
 }
 if (act==="sp-next"){
  var b=S.sp;
  if (b.i+1>=SPRINT.length){ finishRound("sprint",{points:b.pts,correct:b.correct,of:SPRINT.length,best:b.best}); return; }
  b.i++; b.picked=null; b.left=20; b.bonus=0; render(); startSprintClock(); return;
 }

 if (act==="pr-chip"){
  var p=S.pr, it=PRO_ITEMS[p.i];
  if (p.picked!==null) return;
  if (i===it.a){ p.pts+=10; p.correct++; }
  p.picked=i; render(); return;
 }
 if (act==="pr-next"){
  var p2=S.pr;
  if (p2.i+1>=PRO_ITEMS.length){ finishRound("pros",{points:p2.pts,correct:p2.correct,of:PRO_ITEMS.length}); return; }
  p2.i++; p2.picked=null; render(); return;
 }

 if (act==="so-bin"){
  var s=S.so, si=SORT_ITEMS[s.i];
  if (s.picked) return;
  var v=btn.getAttribute("data-v");
  if (v===si.cat){ s.pts+=8; s.correct++; }
  s.picked=v; render(); return;
 }
 if (act==="so-next"){
  var s2=S.so;
  if (s2.i+1>=SORT_ITEMS.length){ finishRound("sort",{points:s2.pts,correct:s2.correct,of:SORT_ITEMS.length}); return; }
  s2.i++; s2.picked=null; render(); return;
 }

 if (act==="fi-opt"){
  var f=S.fi, d=FIN_DECISIONS[f.i];
  if (f.locked) return;
  if (!d.multi){ f.earned=d.pts[i]; f.pts+=f.earned; f.sel=[i]; f.locked=true; render(); return; }
  var k=f.sel.indexOf(i);
  if (k>-1) f.sel.splice(k,1); else if (f.sel.length<d.multi) f.sel.push(i);
  render(); return;
 }
 if (act==="fi-lock"){
  var f2=S.fi, d2=FIN_DECISIONS[f2.i];
  var hits=f2.sel.filter(function(x){ return d2.correct.indexOf(x)>-1; }).length;
  f2.earned = hits===2?20:(hits===1?10:0);
  f2.pts+=f2.earned; f2.locked=true; render(); return;
 }
 if (act==="fi-next"){
  var f3=S.fi;
  if (f3.i+1>=FIN_DECISIONS.length){ finishRound("fin",{points:f3.pts,of:FIN_DECISIONS.length}); return; }
  f3.i++; f3.sel=[]; f3.locked=false; f3.earned=0; render(); return;
 }

 if (act==="ca-opt"){
  var c=S.ca, step=CASES[c.e].steps[c.s];
  if (c.picked!==null) return;
  if (i===step.a){ c.pts+=15; c.correct++; }
  c.picked=i; render(); return;
 }
 if (act==="ca-next"){
  var c2=S.ca, cs=CASES[c2.e];
  if (c2.s+1<cs.steps.length){ c2.s++; c2.picked=null; render(); return; }
  if (c2.e+1<CASES.length){ c2.e++; c2.s=0; c2.picked=null; render(); return; }
  finishRound("cases",{points:c2.pts,correct:c2.correct,of:CASES.length*3}); return;
 }

 if (act==="wr-move"){
  var w=S.wr;
  if (w.checked) return;
  var dir=parseInt(btn.getAttribute("data-d"),10), j=i+dir;
  if (j<0||j>=w.order.length) return;
  var t=w.order[i]; w.order[i]=w.order[j]; w.order[j]=t;
  render(); return;
 }
 if (act==="wr-check"){
  var w2=S.wr, task=ORDER_TASKS[w2.phase];
  var hits2=w2.order.filter(function(l,idx){ return l===task.correct[idx]; }).length;
  w2.pts += hits2*6; w2.checked=true; render(); return;
 }
 if (act==="wr-next"){
  var w3=S.wr;
  if (w3.phase===0){ w3.phase=1; w3.order=shuffle(ORDER_TASKS[1].correct); w3.checked=false; }
  else w3.phase=2;
  render(); return;
 }
 if (act==="wr-rubric"){
  var w4=S.wr, ta=document.getElementById("essay");
  if (ta) w4.essay=ta.value;
  var k4=w4.rubric.indexOf(i);
  if (k4>-1) w4.rubric.splice(k4,1); else w4.rubric.push(i);
  render(); return;
 }
 if (act==="wr-finish"){
  var w5=S.wr, ta2=document.getElementById("essay");
  if (ta2) w5.essay=ta2.value;
  var words = w5.essay.trim() ? w5.essay.trim().split(/\s+/).length : 0;
  finishRound("write",{points:w5.pts + w5.rubric.length*10, essay:w5.essay, rubric:w5.rubric.length, words:words});
  return;
 }

 if (act==="res-add"){
  var inp=document.getElementById("nameinp");
  var nm = inp ? inp.value.trim() : "";
  if (!nm) return;
  var tot=totalPoints();
  S.res.name=nm; S.res.added=true;
  S.board.push({name:nm,total:tot,pct:Math.round(tot/TOTAL_MAX*100),time:S.elapsed});
  render(); return;
 }
 if (act==="res-copy"){
  var t2=totalPoints();
  var text = BUSINESS+": Clear the Board result\n"+
   "Name: "+(S.res.name||"(unnamed)")+"\n"+
   "Score: "+t2+" of "+TOTAL_MAX+" ("+Math.round(t2/TOTAL_MAX*100)+"%)\n"+
   "Time: "+fmt(S.elapsed)+"\n"+
   ROUNDS.map(function(r){ return r.full+": "+((S.results[r.id]&&S.results[r.id].points)||0)+"/"+r.max; }).join("\n");
  copyText(text); S.res.copied=true; render();
  setTimeout(function(){ S.res.copied=false; if (S.stage==="done") render(); },2200);
  return;
 }
 if (act==="res-restart"){
  var keep=S.board;
  stopElapsed(); stopSprintClock();
  S=freshState(); S.board=keep;
  S.wr.order=shuffle(ORDER_TASKS[0].correct);
  render(); return;
 }
});

function copyText(t){
 if (navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); });
 } else fallbackCopy(t);
}
function fallbackCopy(t){
 var ta=document.createElement("textarea");
 ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
 document.body.appendChild(ta); ta.select();
 try { document.execCommand("copy"); } catch(e){}
 document.body.removeChild(ta);
}

S.wr.order = shuffle(ORDER_TASKS[0].correct);
render();
</script>
</body>
</html>
