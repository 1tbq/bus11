<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hire Week at Loop and Spoke Cycles | Staffing a business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1C2B4A; --navy-soft:#2D3F63; --hivis:#F3D530; --steel:#E4E8EF;
    --paper:#FBFBF8; --go:#2F8A57; --stop:#C43D35; --ink:#1A1F2B;
    --display:"Archivo","Arial Narrow",Arial,sans-serif;
    --body:"Atkinson Hyperlegible",Verdana,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--steel);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.55}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--hivis);outline-offset:3px;box-shadow:0 0 0 6px var(--navy)}

  header.bar{background:var(--navy);color:#fff;padding:.7rem 1.25rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .brand{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.25rem}
  .brand span{color:var(--hivis)}
  .stats{display:flex;gap:1.25rem;font-size:.95rem;align-items:center}
  .stats b{font-family:var(--display);font-size:1.2rem;color:var(--hivis)}
  .clock{background:var(--navy-soft);padding:.15rem .6rem;border-radius:4px}
  .clock.over{background:var(--hivis);color:var(--ink)}
  .clock.over b{color:var(--ink)}
  .shift{display:flex;gap:4px;padding:0 1.25rem .8rem;background:var(--navy)}
  .shift div{flex:1;height:8px;background:var(--navy-soft);border-radius:2px}
  .shift div.done{background:var(--hivis)}
  .shift div.now{background:#fff}

  main{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
  h1,h2,h3{font-family:var(--display);font-stretch:78%;line-height:1.05;margin:0 0 .5rem}
  h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:900}
  h2{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:850}
  h3{font-size:1.35rem;font-weight:750}
  p{max-width:68ch;margin:.4rem 0 1rem}
  .step{font-family:var(--display);font-stretch:85%;font-weight:700;color:var(--navy-soft);font-size:1rem;margin-bottom:.2rem}
  .how{display:inline-block;background:var(--navy);color:#fff;font-size:.85rem;font-weight:700;padding:.1rem .55rem;border-radius:4px;margin-left:.4rem;vertical-align:middle}
  .small{font-size:.92rem;color:var(--navy-soft)}

  /* Hero */
  .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center;margin-top:1rem}
  .badge{background:#fff;border-radius:14px;box-shadow:0 18px 0 -8px var(--navy);border:3px solid var(--navy);overflow:hidden;transform:rotate(-3deg)}
  .badge .clip{width:60px;height:14px;background:var(--steel);border:3px solid var(--navy);border-radius:8px;margin:12px auto 0}
  .badge .top{background:var(--hivis);font-family:var(--display);font-stretch:80%;font-weight:800;padding:.5rem 1rem;margin-top:12px}
  .badge .name{font-family:var(--display);font-weight:900;font-stretch:75%;font-size:clamp(2rem,5vw,3rem);padding:1rem 1rem .2rem;min-height:4.2rem;word-break:break-word;line-height:1}
  .badge .role{padding:0 1rem 1.2rem;color:var(--navy-soft);font-weight:700}
  @media (prefers-reduced-motion:no-preference){
    .badge{animation:swing 1.1s ease-out 1}
    @keyframes swing{0%{transform:rotate(9deg) translateY(-30px);opacity:0}60%{transform:rotate(-5deg)}100%{transform:rotate(-3deg)}}
  }
  label.field{display:block;font-weight:700;margin:1rem 0 .3rem}
  input[type=text]{font:inherit;width:100%;max-width:26rem;padding:.7rem .8rem;border:2px solid var(--navy);border-radius:6px;background:#fff}
  .brief{background:#fff;border-left:6px solid var(--hivis);padding:1rem 1.2rem;margin:1.5rem 0;border-radius:0 6px 6px 0}
  .brief ul{margin:.3rem 0 0;padding-left:1.2rem}
  table.run{border-collapse:collapse;width:100%;margin-top:.5rem;font-size:.95rem}
  table.run td{padding:.35rem .5rem;border-bottom:1px solid #d5dae3;vertical-align:top}
  table.run td:first-child{font-family:var(--display);font-weight:800;width:3.5rem}
  table.run td:last-child{text-align:right;white-space:nowrap;font-weight:700}

  .btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:.75rem 1.3rem;font-weight:700}
  .btn:hover{background:var(--navy-soft)}
  .btn.hivis{background:var(--hivis);color:var(--ink)}
  .btn.hivis:hover{background:#FFE14A}
  .btn.ghostbtn{background:transparent;color:var(--navy);border:2px solid var(--navy)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
  .task{background:var(--paper);border:2px solid var(--navy);border-radius:10px;padding:1.3rem 1.4rem;margin-top:1rem}
  .feedback{margin-top:1rem;padding:.8rem 1rem;border-radius:6px;background:#fff;border:2px dashed var(--navy-soft);display:none}
  .feedback.show{display:block}
  .feedback strong{font-family:var(--display);font-stretch:85%;font-size:1.15rem}
  .feedback ul{margin:.4rem 0 0;padding-left:1.2rem}

  /* Drag chips and zones */
  .pool{min-height:3.4rem;display:flex;flex-wrap:wrap;gap:.5rem;padding:.7rem;border:2px dashed #aeb6c4;border-radius:8px;background:#fff;margin-bottom:1rem}
  .pool:empty::after{content:"All placed. Check your answers when ready.";color:var(--navy-soft);font-size:.95rem;align-self:center}
  .chip{background:#fff;border:2px solid var(--navy);border-left-width:8px;border-radius:6px;padding:.45rem .7rem;text-align:left;font-weight:700;color:var(--ink);touch-action:none;user-select:none;max-width:100%;line-height:1.3;font-size:.98rem}
  .chip:hover{background:#FFF7C2}
  .chip.sel{background:var(--hivis)}
  .chip.dragging{opacity:.3}
  .chip.ok{border-color:var(--go);background:#E3F2E9}
  .chip.no{border-color:var(--stop);background:#F8E1DF}
  .ghost{position:fixed;pointer-events:none;z-index:99;transform:rotate(2deg);box-shadow:0 10px 24px rgba(28,43,74,.35);margin:0}
  .zones{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .zone{border:2px solid var(--navy);border-radius:8px;background:#fff;padding:.6rem;min-height:9rem}
  .zone>.label{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:1.15rem;background:var(--navy);color:#fff;margin:-.6rem -.6rem .6rem;padding:.4rem .6rem;border-radius:6px 6px 0 0}
  .hold{display:flex;flex-direction:column;gap:.4rem;min-height:2.6rem}
  .zone.hover,.zone:focus-visible{background:#FFF7C2}
  .slotrow{display:grid;grid-template-columns:2.4rem 1fr;gap:.6rem;align-items:center;margin-bottom:.5rem}
  .slotnum{font-family:var(--display);font-weight:900;font-size:1.6rem;text-align:center;color:var(--navy)}
  .zone.slot{min-height:3.2rem;padding:.35rem;border-style:dashed}
  .matchrow{display:grid;grid-template-columns:1.3fr 1fr;gap:.6rem;align-items:center;margin-bottom:.55rem}
  .matchrow .def{background:#fff;border:2px solid #cdd3dd;border-radius:6px;padding:.5rem .7rem}
  .blankline{background:#fff;border:2px solid #cdd3dd;border-radius:6px;padding:.6rem .8rem;margin-bottom:.55rem;line-height:2.4}
  .zone.blank{display:inline-flex;min-height:2.4rem;min-width:9.5rem;vertical-align:middle;padding:.15rem;border-style:dashed;margin:0 .2rem}
  .zone.blank .hold,.zone.slot .hold{min-height:0;width:100%}

  /* Job ad */
  .ad{background:#fff;border:2px solid var(--navy);border-radius:6px;padding:1.2rem 1.4rem;line-height:2}
  .phrase{background:none;border:0;border-bottom:2px dotted var(--navy-soft);padding:0 .1rem;color:var(--ink)}
  .phrase:hover{background:#FFF4B0}
  .phrase.flagged{background:var(--stop);color:#fff;border-radius:3px}
  .phrase.okay{background:var(--go);color:#fff;border-radius:3px}
  .phrase.missed{outline:3px solid var(--stop);border-radius:3px}
  textarea{font:inherit;width:100%;min-height:6rem;padding:.7rem;border:2px solid var(--navy);border-radius:6px;background:#fff}

  /* Swipe */
  .deck{position:relative;height:250px;max-width:520px;margin:1rem auto}
  .card{position:absolute;inset:0;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:1.4rem;display:flex;flex-direction:column;justify-content:center;font-size:1.35rem;font-weight:700;touch-action:none;user-select:none;cursor:grab;box-shadow:0 8px 0 -2px var(--navy)}
  .card .who{font-size:.9rem;color:var(--navy-soft);margin-bottom:.4rem}
  .card.under{transform:translateY(10px) scale(.96);opacity:.6}
  .card.fly{transition:transform .35s ease-in,opacity .35s}
  .swipebtns{display:flex;justify-content:space-between;max-width:520px;margin:0 auto}
  .btn.bin{background:var(--stop)}
  .btn.keep{background:var(--go)}

  /* Memory */
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  .mcard{aspect-ratio:4/3;border:2px solid var(--navy);border-radius:8px;background:var(--navy);color:var(--navy);font-weight:700;font-size:.9rem;padding:.4rem;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center}
  .mcard.up{background:#fff;color:var(--ink)}
  .mcard.term.up{font-family:var(--display);font-stretch:80%;font-size:1.25rem;font-weight:800}
  .mcard.found{background:#E3F2E9;border-color:var(--go);color:var(--ink);cursor:default}
  .mcard:not(.up):not(.found)::after{content:"?";color:var(--hivis);font-family:var(--display);font-size:2rem;font-weight:900}

  /* Clock quiz */
  .timerbar{height:12px;background:#cdd3dd;border-radius:6px;overflow:hidden;margin:.5rem 0 1rem}
  .timerbar div{height:100%;background:var(--hivis);width:100%;transition:width 1s linear}
  .choices{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .choice{background:#fff;border:2px solid var(--navy);border-radius:6px;padding:.75rem .9rem;text-align:left;font-weight:700;color:var(--ink)}
  .choice:hover:not(:disabled){background:var(--hivis)}
  .choice.right{background:var(--go);border-color:var(--go);color:#fff}
  .choice.wrong{background:var(--stop);border-color:var(--stop);color:#fff}
  .prompt{font-size:1.25rem;font-weight:700;margin:.5rem 0 1rem;max-width:60ch}

  .sides{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .model{display:none;margin-top:1rem;background:#fff;border-radius:6px;padding:1rem 1.2rem;border:2px solid var(--go)}
  .model.show{display:block}
  .model ul{margin:.3rem 0 .8rem;padding-left:1.2rem}
  .result-title{font-family:var(--display);font-weight:900;font-stretch:75%;font-size:clamp(2.4rem,6vw,4rem);background:var(--hivis);display:inline-block;padding:.1rem .6rem;margin:.5rem 0 1rem;transform:rotate(-1.5deg)}
  table.tally{border-collapse:collapse;margin:1rem 0;min-width:300px}
  table.tally td{padding:.4rem .8rem;border-bottom:1px solid #c9ced8}
  table.tally td:last-child{text-align:right;font-weight:700}

  @media (max-width:680px){
    .hero,.sides,.matchrow{grid-template-columns:1fr}
    .badge{max-width:320px}
    .mem{grid-template-columns:repeat(3,1fr)}
  }
  @media (prefers-reduced-motion:reduce){.card.fly{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Loop <span>&amp;</span> Spoke Cycles &nbsp;|&nbsp; Hire week</div>
  <div class="stats" aria-live="polite">
    <div>Points <b id="points">0</b></div>
    <div>Accuracy <b id="acc">0%</b></div>
    <div class="clock" id="clockWrap" hidden><b id="clock">0:00</b> <span id="clockTarget"></span></div>
  </div>
</header>
<div class="shift" id="shift" aria-hidden="true"></div>
<main id="app"></main>

<script>
/* ===================================================================
   Content based on Jacaranda Key Concepts in VCE Business Management
   Units 1 & 2 (7th ed.), Topic 6 Staffing a business.
   =================================================================== */
const STAGES = [
  { id:"cycle", title:"Clock on", mins:4, type:"order", how:"Drag to order",
    intro:"Priya, the owner of Loop & Spoke Cycles, is opening a new shop in Werribee. Before you do anything, show her you know the employment cycle. Put the stages in order.",
    items:["Planning staffing needs","Recruitment","Selection","Induction","Performance management and development","Termination of employment"],
    note:"The employment cycle covers every stage of employing staff, from initial planning through to the end of employment."
  },
  { id:"plan", title:"Plan the team", mins:5, type:"bins", how:"Drag into bins",
    intro:"The shop needs a bike mechanic. Job analysis produces two documents. Drag each line into the right one.",
    options:["Job description","Job specification"],
    items:[
      {q:"Service and repair customer bikes", a:0, why:"A duty of the job belongs in the job description."},
      {q:"Certificate III in Bicycle Mechanics", a:1, why:"A qualification the person needs goes in the job specification."},
      {q:"Two years of workshop experience", a:1, why:"Level of experience is part of the job specification."},
      {q:"Order spare parts and update the stock list", a:0, why:"A task the employee performs is part of the job description."},
      {q:"Reports to the workshop manager", a:0, why:"Responsibilities and reporting lines describe the job itself."},
      {q:"Strong knowledge of e-bike electrical systems", a:1, why:"Knowledge needed to do the job sits in the job specification."},
      {q:"Explain repair quotes to customers", a:0, why:"This is a duty of the role."},
      {q:"Current driver licence for van deliveries", a:1, why:"A requirement the applicant must hold belongs in the job specification."}
    ]
  },
  { id:"recruit", title:"Find applicants", mins:5, type:"bins", how:"Drag into bins",
    intro:"Priya can't decide whether to promote from inside or advertise on SEEK. Each card is an advantage or a disadvantage. Drag it to the recruitment method it belongs to.",
    options:["Internal recruitment","External recruitment"],
    items:[
      {q:"Already knows the shop's culture and processes", a:0, why:"Internal applicants are familiar with the business, its objectives and culture."},
      {q:"Brings new ideas and fresh approaches", a:1, why:"Outside applicants can bring new ideas."},
      {q:"Two staff apply and it causes rivalry", a:0, why:"Conflict between internal applicants is a disadvantage of internal recruitment."},
      {q:"Advertising costs and agency fees add up", a:1, why:"Advertising and agency costs are a disadvantage of external recruitment."},
      {q:"Creates a career path that rewards loyal staff", a:0, why:"Promoting from within rewards valued employees."},
      {q:"A much wider range of applicants", a:1, why:"External recruitment widens the field of applicants."},
      {q:"The promoted person's old job still needs filling", a:0, why:"The internal applicant's old role often has to be filled, so external recruitment may be needed anyway."},
      {q:"Current staff resent an outsider coming in as supervisor", a:1, why:"Existing employees may resent outsiders, especially in supervisory roles."}
    ]
  },
  { id:"select", title:"Pick your tools", mins:5, type:"match", how:"Drag to match",
    intro:"Forty people applied. Priya needs to narrow the field. Drag each selection method onto its description.",
    pairs:[
      {term:"Application form", def:"Candidates outline their personal details, skills and experience"},
      {term:"Psychological testing", def:"Reveals personality and how a candidate may respond to work situations"},
      {term:"Work testing", def:"Checks the technical knowledge and skills needed for the actual job"},
      {term:"Online selection", def:"Early screening such as a multiple-choice test completed on the internet"},
      {term:"Interview", def:"The most common method, using the same questions for each candidate"},
      {term:"Background check", def:"Contacting referees to verify experience, performance or record"}
    ]
  },
  { id:"ad", title:"Fix the job ad", mins:5, type:"ad", how:"Click to flag",
    intro:"Priya's nephew wrote this ad in five minutes. Some phrases could breach equal employment opportunity laws. Click every phrase that is a problem, then check."
  },
  { id:"interview", title:"Run the interview", mins:4, type:"swipe", how:"Swipe the cards",
    intro:"You're on the interview panel. Questions should relate to skills and experience, not personal matters. Swipe right (or press the right arrow) to keep a question. Swipe left to bin it.",
    items:[
      {q:"Tell me about a time you dealt with an unhappy customer.", a:1, why:"This tests experience that relates directly to the job."},
      {q:"Are you planning to start a family soon?", a:0, why:"Parental status, pregnancy and family responsibilities are protected attributes."},
      {q:"The roster includes Saturdays. Can you work those shifts?", a:1, why:"Availability for the actual hours of the job is fair to ask every applicant."},
      {q:"How old are you?", a:0, why:"Age is a protected attribute."},
      {q:"How would you diagnose a slipping gear?", a:1, why:"This checks technical knowledge for the job."},
      {q:"Which church do you go to?", a:0, why:"Religious belief or activity is protected under the Equal Opportunity Act 2010 (Vic)."},
      {q:"Have you ever been part of union action?", a:0, why:"Industrial activity is a protected attribute."},
      {q:"Can we contact your previous manager as a referee?", a:1, why:"Referee checks are a normal part of selection."}
    ]
  },
  { id:"memory", title:"Smoko break", mins:5, type:"memory", how:"Flip to match",
    intro:"Quick brain break. Flip two cards at a time to match each key term with its meaning. Fewer flips is better.",
    pairs:[
      {term:"Nepotism", def:"A family member is favoured for a position"},
      {term:"Award", def:"Legally binding minimum wages and conditions for a group of employees"},
      {term:"Enterprise agreement", def:"Negotiated directly between an employer and its employees"},
      {term:"Job security", def:"The belief that the employee will not lose their job"},
      {term:"Salary sacrifice", def:"Giving up salary to receive a non-cash benefit of equal value"},
      {term:"Affirmative action", def:"Positive steps to overcome a historical lack of equal opportunity"}
    ]
  },
  { id:"contract", title:"Sign them up", mins:4, type:"bins", how:"Drag into bins",
    intro:"Six new hires, four kinds of employment arrangement. Drag each person to the right one.",
    options:["Full-time permanent","Part-time permanent","Casual","Fixed-term"],
    items:[
      {q:"Mei covers the manager's 12 months of parental leave, then her contract ends", a:3, why:"Employment for a specific period is a fixed-term contract."},
      {q:"Jack works an ongoing 38 hours a week with 4 weeks' annual leave", a:0, why:"Ongoing work of about 38 hours with full entitlements is full-time permanent."},
      {q:"Sam, a Year 12 student, is called in for busy Saturdays and paid by the hour", a:2, why:"Casual employees are employed on an hourly basis."},
      {q:"Ali works an ongoing three days a week with leave at 60 per cent", a:1, why:"Part-time permanent staff get entitlements on a pro rata basis."},
      {q:"Tom is hired for 6 months to run a trial e-bike hire service", a:3, why:"A set period of employment is fixed-term."},
      {q:"Zara fills in when someone calls in sick and gets no paid annual leave", a:2, why:"Casual employees are not entitled to annual leave."}
    ]
  },
  { id:"nes", title:"Know the rules", mins:5, type:"blanks", how:"Drag words into gaps",
    intro:"Priya wants to write a staff fact sheet about legal minimums. Drag words from the bank into the gaps. Watch out, some words are decoys.",
    lines:[
      "Employers can't require staff to work more than {38} hours a week unless the extra hours are reasonable.",
      "Most full-time employees get {four weeks} of paid annual leave, but {casual} employees get none.",
      "Employees can take {12 months} of unpaid parental leave for the birth or adoption of a child.",
      "Full-time employees generally get {ten days} of personal or carer's leave each year.",
      "In Victoria, occupational health and safety is administered by {WorkSafe Victoria}.",
      "Every employer must take out {workers compensation} insurance."
    ],
    decoys:["40","two weeks","6 months","Fair Work Commission","permanent","private health"]
  },
  { id:"clock", title:"Beat the clock", mins:3, type:"clock", how:"75 second quiz", seconds:75,
    intro:"Priya's accountant has a few quick questions. Answer as many as you can before the timer runs out.",
    items:[
      {q:"Attracting qualified job applicants is called", c:["Selection","Recruitment","Induction","Retention"], a:1, why:"Recruitment attracts applicants. Selection chooses one."},
      {q:"Productivity is calculated as", c:["Inputs / outputs","Outputs / inputs","Revenue minus costs","Staff / sales"], a:1, why:"Productivity = outputs / inputs."},
      {q:"A third party who can suggest solutions is part of", c:["Mediation","Conciliation","Arbitration","Induction"], a:1, why:"A conciliator can suggest solutions. A mediator does not."},
      {q:"Sending business activities overseas is", c:["Offshoring","Outsourcing staff","Downsizing","Nepotism"], a:0, why:"Offshoring sends certain business activities overseas."},
      {q:"Extra pay for working outside normal hours is a", c:["Salary","Bonus","Penalty rate","Wage"], a:2, why:"Penalty rates are paid for work outside normal hours."},
      {q:"A fixed yearly amount divided into pay periods is a", c:["Wage","Salary","Commission","Loading"], a:1, why:"A salary is a fixed yearly amount. A wage is an hourly or weekly rate."},
      {q:"Money paid into a fund for retirement is", c:["Superannuation","Remuneration","Long service leave","Salary sacrifice"], a:0, why:"Superannuation provides benefits after retirement."},
      {q:"Achieving the right amount of time for work and personal life is", c:["Job security","Job design","Work-life balance","Flexible rostering"], a:2, why:"That is the definition of work-life balance."},
      {q:"The detail of the number, kind and variety of tasks in a job is", c:["Job analysis","Job design","Job specification","Job security"], a:1, why:"Job design details the tasks and can add variety to keep staff motivated."},
      {q:"An official authorisation to enter and stay in a country is a", c:["Visa","Passport","Award","Permit to work"], a:0, why:"A visa authorises an overseas visitor to enter and remain for a period."}
    ]
  },
  { id:"induct", title:"First day, fair workplace", mins:5, type:"bins", how:"Drag into bins",
    intro:"The new mechanic starts Monday. Sort each action: is it part of induction, a socially responsible staffing practice, or a red flag Priya should avoid?",
    options:["Induction","Socially responsible practice","Red flag"],
    items:[
      {q:"A workshop tour showing fire exits and the first aid kit", a:0, why:"Safety is a typical induction topic."},
      {q:"Pairing the new starter with a mentor", a:0, why:"A mentor system is an induction method."},
      {q:"An employee handbook with policies and the shop's history", a:0, why:"Induction handbooks are a common method."},
      {q:"Giving honest feedback to unsuccessful applicants", a:1, why:"Socially responsible recruitment gives every applicant a fair hearing and honest feedback."},
      {q:"Consulting staff before changing the roster system", a:1, why:"Consulting employees on important workplace issues is socially responsible and supports industrial democracy."},
      {q:"Letting carers request different start and finish times", a:1, why:"Balancing work and family responsibilities is socially responsible."},
      {q:"Hiring Priya's nephew without advertising the job", a:2, why:"This is nepotism and denies other applicants a fair go."},
      {q:"Firing a worker by text message", a:2, why:"A socially responsible employer handles dismissal in a sensitive and supportive way."},
      {q:"Ignoring a bullying complaint because the shop is busy", a:2, why:"Socially responsible employers discourage workplace bullying and harassment."}
    ]
  },
  { id:"evaluate", title:"Both sides of the desk", mins:8, type:"evaluate", how:"Team discussion" }
];

const AD = {
  heading:"Bike mechanic wanted, Werribee",
  parts:[
    {t:"Loop & Spoke Cycles is looking for a "},

const S = {team:"", stage:-1, points:0, got:0, of:0, tally:{}};
const app = document.getElementById("app");

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const $ = id => document.getElementById(id);

function drawShift(){

}
function updateStats(){
  $("points").textContent = S.points;

}
function award(ok, id, pts=10){
  const t = S.tally[id] = S.tally[id] || {got:0,of:0};
  t.of++; S.of++;
  if(ok){ t.got++; S.got++; S.points += pts; }

function startClock(mins){

  stageStart = Date.now();

  const run = () => {
    const s = Math.floor((Date.now()-stageStart)/1000);
    $("clock").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    $("clockWrap").classList.toggle("over", s > mins*60);
  };

}
function head(st){

function nextButton(label="Next shift"){

}

/* ===================================================================
   Drag board: works with mouse, touch and keyboard.
   Drag a chip onto a zone, or click/Enter a chip then click/Enter a zone.
   =================================================================== */
function dragBoard(root, onChange){
  const pool = root.querySelector(".pool");
  let sel = null, drag = null;

  const holderOf = z => z.querySelector(".hold") || z;
  function place(chip, target){
    if(!target) return;
    const from = chip.parentElement;
    if(target.classList.contains("zone")){
      const holder = holderOf(target), cap = +target.dataset.cap || 99;
      const others = [...holder.querySelectorAll(".chip")].filter(c=>c!==chip);
      if(others.length >= cap) (from === holder ? pool : from).appendChild(others[0]);
      holder.appendChild(chip);
    } else {
      pool.appendChild(chip);
    }
    clearSel(); onChange && onChange();
  }
  function clearSel(){ if(sel) sel.classList.remove("sel"); sel = null; }
  function toggleSel(chip){
    if(sel === chip){ clearSel(); return; }
    clearSel(); sel = chip; chip.classList.add("sel");
  }
  const locked = () => root.dataset.locked === "1";

  root.addEventListener("pointerdown", e => {
    const chip = e.target.closest(".chip");
    if(!chip || locked() || e.button > 0) return;
    drag = {chip, x:e.clientX, y:e.clientY, id:e.pointerId, moving:false};
    try{ chip.setPointerCapture(e.pointerId); }catch(_){}
  });
  root.addEventListener("pointermove", e => {
    if(!drag || e.pointerId !== drag.id) return;
    if(!drag.moving && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6){
      drag.moving = true;
      const r = drag.chip.getBoundingClientRect();
      drag.ox = e.clientX - r.left; drag.oy = e.clientY - r.top;
      const g = drag.chip.cloneNode(true);
      g.classList.add("ghost"); g.classList.remove("sel"); g.style.width = r.width + "px";
      document.body.appendChild(g); drag.ghost = g;
      drag.chip.classList.add("dragging");
    }
    if(drag.moving){
      drag.ghost.style.left = (e.clientX - drag.ox) + "px";
      drag.ghost.style.top = (e.clientY - drag.oy) + "px";
      root.querySelectorAll(".zone.hover").forEach(z=>z.classList.remove("hover"));
      const over = document.elementFromPoint(e.clientX, e.clientY);
      const z = over && over.closest(".zone");
      if(z && root.contains(z)) z.classList.add("hover");
    }
  });
  function endDrag(e, cancelled){
    if(!drag) return;
    const d = drag; drag = null;
    root.querySelectorAll(".zone.hover").forEach(z=>z.classList.remove("hover"));
    if(d.moving){
      d.ghost.remove(); d.chip.classList.remove("dragging");
      if(!cancelled){
        const over = document.elementFromPoint(e.clientX, e.clientY);
        const t = over && over.closest(".zone, .pool");
        if(t && root.contains(t)) place(d.chip, t);
      }
    } else if(!cancelled){
      toggleSel(d.chip);
    }
  }
  root.addEventListener("pointerup", e => endDrag(e, false));
  root.addEventListener("pointercancel", e => endDrag(e, true));

  // Keyboard and tap-to-place
  root.addEventListener("click", e => {
    if(locked()) return;
    const chip = e.target.closest(".chip");
    if(chip){ if(e.detail === 0) toggleSel(chip); return; }
    const t = e.target.closest(".zone, .pool");
    if(t && sel) place(sel, t);
  });
  root.addEventListener("keydown", e => {
    if(locked()) return;
    const z = e.target.closest(".zone, .pool");
    if(z && e.target === z && sel && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); place(sel, z); }
  });
}
const chipHTML = (text, ans, why="") => `<button class="chip" data-ans="${esc(ans)}" data-why="${esc(why)}">${esc(text)}</button>`;
const zoneAttrs = (zoneKey, cap) => `class="zone" data-zone="${esc(zoneKey)}" data-cap="${cap}" tabindex="0" role="button"`;

/* Generic check for chip-based stages */
function wireCheck(st, board, mode){
  const btn = $("check");
  const ready = () => mode === "zones"
    ? [...board.querySelectorAll(".zone")].every(z=>z.querySelector(".chip"))
    : !board.querySelector(".pool .chip");
  const refresh = () => btn.disabled = !ready();
  dragBoard(board, refresh); refresh();

  btn.onclick = () => {
    board.dataset.locked = "1"; btn.disabled = true;
    const misses = [];
    if(mode === "zones"){
      board.querySelectorAll(".zone").forEach(z=>{
        const chip = z.querySelector(".chip");
        const ok = chip.dataset.ans === z.dataset.zone;
        chip.classList.add(ok ? "ok" : "no");
        award(ok, st.id);
        if(!ok) misses.push(`<li>The gap needed <b>${esc(z.dataset.zone)}</b>, not ${esc(chip.textContent)}.</li>`);
      });
    } else {
      board.querySelectorAll(".chip").forEach(chip=>{
        const z = chip.closest(".zone");
        const ok = z && z.dataset.zone === chip.dataset.ans;
        chip.classList.add(ok ? "ok" : "no");
        award(ok, st.id);
        if(!ok) misses.push(`<li><b>${esc(chip.textContent)}</b>: ${esc(chip.dataset.why)}</li>`);
      });
    }
    const t = S.tally[st.id];
    $("fb").innerHTML = `<strong>${t.got} of ${t.of} correct.</strong> ${
      misses.length ? "Green is right, red needs fixing. Here's why:<ul>"+misses.join("")+"</ul>" : "Perfect shift."}
      ${st.note ? `<p style="margin-bottom:0">${esc(st.note)}</p>` : ""}`;
    $("fb").classList.add("show");
    showNext();
  };
}

function renderStage(){
  drawShift();
  const st = STAGES[S.stage];
  if(!st) return finish();
  startClock(st.mins);
  ({order:renderOrder, bins:renderBins, match:renderMatch, ad:renderAd, swipe:renderSwipe,
    memory:renderMemory, blanks:renderBlanks, clock:renderClock, evaluate:renderEvaluate})[st.type](st);
  window.scrollTo({top:0});
}

    <div class="pool" tabindex="0" role="button" aria-label="Card pool">${chips.join("")}</div>

    <p class="small" style="margin-top:.8rem">Hint: there are more than three problems.</p>

    <div class="feedback" id="fb" aria-live="polite"></div>

  const phrases = [...app.querySelectorAll(".phrase")];

    $("fb").classList.add("show");

function renderSwipe(st){
  const items = shuffle(st.items);
  let i = 0, busy = false;
  app.innerHTML = `${head(st)}
  <div class="task">
    <div class="small" id="count"></div>
    <div class="deck" id="deck"></div>
    <div class="swipebtns">
      <button class="btn bin" id="binBtn">Bin it</button>
      <button class="btn keep" id="keepBtn">Fine to ask</button>
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    ${nextButton()}
  </div>`;
  const deck = $("deck");

  function draw(){
    $("count").textContent = i < items.length ? `Question ${i+1} of ${items.length}` : "";
    deck.innerHTML = "";
    if(items[i+1]) deck.insertAdjacentHTML("beforeend", `<div class="card under"><div class="who">Interview panel</div>${esc(items[i+1].q)}</div>`);
    if(items[i]){
      deck.insertAdjacentHTML("beforeend", `<div class="card" id="top"><div class="who">Interview panel asks</div>${esc(items[i].q)}</div>`);
      wireCard($("top"));
    }
  }
  function answer(keep){
    if(busy || i >= items.length) return;
    busy = true;
    const it = items[i], ok = (keep ? 1 : 0) === it.a, card = $("top");
    award(ok, st.id);
    card.classList.add("fly");
    card.style.transform = `translateX(${keep ? 140 : -140}%) rotate(${keep ? 18 : -18}deg)`;
    card.style.opacity = "0";
    $("fb").innerHTML = `<strong>${ok ? "Correct." : "Not quite."}</strong> “${esc(it.q)}” ${it.a ? "is fine to ask." : "should be binned."} ${esc(it.why)}`;
    $("fb").classList.add("show");
    setTimeout(()=>{
      i++; busy = false; draw();
      if(i >= items.length){
        const t = S.tally[st.id];
        deck.innerHTML = `<div class="card" style="cursor:default;text-align:center"><div class="who">Panel finished</div>${t.got} of ${t.of} correct</div>`;
        $("binBtn").disabled = $("keepBtn").disabled = true;
        showNext();
      }
    }, 380);
  }
  function wireCard(card){
    let sx = null, dx = 0;
    card.addEventListener("pointerdown", e=>{ sx = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); });
    card.addEventListener("pointermove", e=>{
      if(sx === null) return;
      dx = e.clientX - sx;
      card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    });
    const end = () => {
      if(sx === null) return; sx = null;
      if(Math.abs(dx) > 90) answer(dx > 0);
      else card.style.transform = "";
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }
  $("binBtn").onclick = () => answer(false);
  $("keepBtn").onclick = () => answer(true);
  const keys = e => {
    if(S.stage < 0 || STAGES[S.stage].id !== st.id){ document.removeEventListener("keydown", keys); return; }
    if(e.key === "ArrowLeft") answer(false);
    if(e.key === "ArrowRight") answer(true);
  };
  document.addEventListener("keydown", keys);
  draw();
}

function renderMemory(st){
  const cards = shuffle(st.pairs.flatMap((p,i)=>[{k:i,t:p.term,term:true},{k:i,t:p.def,term:false}]));
  app.innerHTML = `${head(st)}
  <div class="task">
    <div class="small">Flips: <b id="flips">0</b> &nbsp; Pairs found: <b id="found">0</b> of ${st.pairs.length}</div>
    <div class="mem" id="mem" style="margin-top:.8rem">
      ${cards.map((c,i)=>`<button class="mcard ${c.term?'term':''}" data-i="${i}" aria-label="Hidden card ${i+1}"></button>`).join("")}
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    ${nextButton()}
  </div>`;
  let open = [], flips = 0, found = 0, wait = false;
  const btns = [...app.querySelectorAll(".mcard")];
  const show = (b,up) => { const c = cards[+b.dataset.i]; b.classList.toggle("up",up); b.textContent = up ? c.t : ""; b.setAttribute("aria-label", up ? c.t : "Hidden card"); };
  btns.forEach(b=>b.onclick=()=>{
    if(wait || b.classList.contains("up") || b.classList.contains("found")) return;
    show(b,true); open.push(b);
    if(open.length === 2){
      flips++; $("flips").textContent = flips;
      const [a,c] = open.map(x=>cards[+x.dataset.i]);
      if(a.k === c.k && a.term !== c.term){
        open.forEach(x=>{x.classList.add("found");x.classList.remove("up");});
        open = []; found++; $("found").textContent = found;
        award(true, st.id);
        if(found === st.pairs.length){
          const bonus = Math.max(0, (st.pairs.length*2 - flips)) * 5;
          S.points += bonus; updateStats();
          $("fb").innerHTML = `<strong>All pairs in ${flips} flips.</strong> ${bonus ? "Efficiency bonus: "+bonus+" points." : "Try for fewer flips next time."}`;
          $("fb").classList.add("show"); showNext();
        }
      } else {
        wait = true;
        setTimeout(()=>{ open.forEach(x=>show(x,false)); open = []; wait = false; }, 1000);
      }
    }
  });
}

function renderClock(st){
  const items = shuffle(st.items);
  let i = 0, left = st.seconds, done = false, timer = null;
  const wrong = [];
  app.innerHTML = `${head(st)}
  <div class="task" id="qbox">
    <div class="row" style="margin-top:0"><button class="btn hivis" id="go">Start the timer</button></div>
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>${nextButton()}`;
  $("go").onclick = () => {
    timer = setInterval(()=>{
      left--; const bar = $("tbar"); if(bar) bar.style.width = (100*left/st.seconds)+"%";
      const lbl = $("tleft"); if(lbl) lbl.textContent = left;
      if(left <= 0) end();
    }, 1000);
    drawQ();
  };
  function drawQ(){
    if(done) return;
    if(i >= items.length) return end();
    const it = items[i];
    $("qbox").innerHTML = `<div class="small">Question ${i+1} of ${items.length} &nbsp; <b id="tleft">${left}</b> seconds left</div>
      <div class="timerbar"><div id="tbar" style="width:${100*left/st.seconds}%"></div></div>
      <div class="prompt">${esc(it.q)}...</div>
      <div class="choices">${it.c.map((c,k)=>`<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")}</div>`;
    $("qbox").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(done) return;
      const k = +b.dataset.k, ok = k === it.a;
      $("qbox").querySelectorAll(".choice").forEach(x=>{ x.disabled = true; if(+x.dataset.k === it.a) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      award(ok, st.id);
      if(!ok) wrong.push(it);
      setTimeout(()=>{ i++; drawQ(); }, 650);
    });
    $("qbox").querySelector(".choice").focus();
  }
  function end(){
    if(done) return; done = true; clearInterval(timer);
    const t = S.tally[st.id] || {got:0,of:0};
    $("qbox").innerHTML = `<div class="prompt">${left <= 0 ? "Time's up." : "Finished with "+left+" seconds to spare."}</div>
      <p>You answered ${t.of} of ${items.length} and got ${t.got} right.</p>`;
    if(wrong.length){
      $("fb").innerHTML = `<strong>Review these</strong><ul>${wrong.map(w=>`<li><b>${esc(w.q)}</b> ${esc(w.c[w.a])}. ${esc(w.why)}</li>`).join("")}</ul>`;
      $("fb").classList.add("show");
    }
    showNext();
  }
}

    <div class="sides">
      <div><label class="field" for="emp">Priya, the employer</label><textarea id="emp" placeholder="Advantages and disadvantages for the business"></textarea></div>
      <div><label class="field" for="wkr">The staff</label><textarea id="wkr" placeholder="Advantages and disadvantages for employees"></textarea></div>
    </div>
    <label class="field" for="judge">Your judgement</label>
    <textarea id="judge" style="min-height:4.5rem" placeholder="Overall, is this a good strategy? Why?"></textarea>
    <div class="row"><button class="btn hivis" id="reveal">Compare with the model answer</button></div>
    <div class="model" id="model">
      <h3>Self-check: 5 points for each idea your team covered</h3>
      <p><b>Employer perspective</b></p><ul>${EVALUATE.employer.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <p><b>Employee perspective</b></p><ul>${EVALUATE.employee.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <p><b>Judgement</b></p><p>${esc(EVALUATE.judgement)}</p>
      <label class="field" for="self">How many ideas did you cover, including a judgement? (0 to 9)</label>
      <input type="text" id="self" inputmode="numeric" style="max-width:6rem">
      <div class="row"><button class="btn" id="done">Clock off for the week</button></div>
    </div>
  </div>`;
  $("reveal").onclick = function(){ this.hidden = true; $("model").classList.add("show"); $("self").focus(); };
  $("done").onclick = () => {
    let n = parseInt($("self").value,10); if(isNaN(n)) n = 0; n = Math.max(0,Math.min(9,n));
    S.tally[st.id] = {got:n, of:9, self:true};
    S.points += n*5; updateStats();
    S.stage++; renderStage();
  };
}

/* ===================================================================
   Start and finish
   =================================================================== */
function start(){
  clearInterval(tick); $("clockWrap").hidden = true;
  drawShift();
  const total = STAGES.reduce((a,s)=>a+s.mins,0);
  app.innerHTML = `
  <section class="hero">
    <div>
      <h1>Hire week</h1>
      <p>You've just been made the HR team at Loop &amp; Spoke Cycles. The owner is opening a new shop and needs a mechanic planned for, hired, signed and trained by Friday. Get it wrong and it could cost the business money, reputation or a court case.</p>
      <label class="field" for="team">Your team name</label>
      <input type="text" id="team" maxlength="28" placeholder="e.g. The Chain Gang" autocomplete="off">
      <div class="row"><button class="btn hivis" id="go" disabled>Start the week</button></div>
    </div>
    <div class="badge" aria-label="Staff name badge preview">
      <div class="clip"></div>
      <div class="top">Loop &amp; Spoke Cycles</div>
      <div class="name" id="badgeName">Your team</div>
      <div class="role">Human resource management</div>
    </div>
  </section>
  <div class="brief">
    <h3>The week ahead</h3>
    <p class="small" style="margin:0">About ${total + 2} minutes including this intro. The timer in the top bar shows how long you've spent on each shift. It turns yellow when you go over, but it won't stop you.</p>
    <table class="run"><tbody>
      ${STAGES.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.title)} <span class="small">(${esc(s.how)})</span></td><td>${s.mins} min</td></tr>`).join("")}
    </tbody></table>
  </div>`;
  const inp = $("team"), go = $("go"), bn = $("badgeName");
  inp.addEventListener("input", ()=>{ bn.textContent = inp.value.trim() || "Your team"; go.disabled = !inp.value.trim(); });
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && inp.value.trim()) go.click(); });
  go.onclick = () => { S.team = inp.value.trim(); S.stage = 0; renderStage(); };
  inp.focus();
}

function finish(){
  clearInterval(tick); $("clockWrap").hidden = true;
  $("shift").innerHTML = STAGES.map(()=>`<div class="done"></div>`).join("");
  const acc = S.of ? Math.round(100*S.got/S.of) : 0;
  let title, line;
  if(acc >= 85){ title="Employer of choice"; line="People will queue up to work at Loop & Spoke. Your staffing decisions were legal, fair and smart."; }
  else if(acc >= 70){ title="Promoted to HR manager"; line="Solid week. Look at the shifts where you dropped marks before the SAC."; }
  else if(acc >= 50){ title="Kept on after probation"; line="You got the mechanic hired, but a few decisions could have landed Priya in trouble. Revisit those sections of the topic."; }
  else { title="See me in my office"; line="Tough week. Go back through the topic summary and have another go."; }
  const rows = STAGES.map(s=>{ const t = S.tally[s.id]; return t ? `<tr><td>${esc(s.title)}</td><td>${t.got} / ${t.of}${t.self ? " (self-rated)" : ""}</td></tr>` : ""; }).join("");
  app.innerHTML = `
    <div class="step">End of the week</div>
    <h2>${esc(S.team)}</h2>
    <div class="result-title">${title}</div>
    <p>${line}</p>
    <p><b>${S.points} points &nbsp; ${acc}% accuracy</b></p>
    <table class="tally"><tbody>${rows}</tbody></table>
    <div class="brief">
      <h3>Exit ticket</h3>
      <p>Write one sentence for each: the difference between recruitment and selection, one question an employer can't ask in an interview and why, and one benefit of induction for the employer and one for the employee.</p>
    </div>
    <div class="row"><button class="btn hivis" id="again">Play again</button></div>`;
  $("again").onclick = () => { Object.assign(S,{team:"",stage:-1,points:0,got:0,of:0,tally:{}}); updateStats(); start(); };
}

start();
</script>
</body>
</html>
