<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

  --ink3: #27352f;
  --panel: #f3eee2;

}
h1, h2, h3 { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }

button { font-family: inherit; cursor: pointer; }

.strip { position: sticky; top: 0; z-index: 30; background: var(--ink2); border-bottom: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.strip-in { max-width: 940px; margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
.brand .mark { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: var(--ink); background: var(--amber); padding: 3px 7px; border-radius: 2px; }
.brand .nm { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 15px; }
.gauge { text-align: right; }

.rail { max-width: 940px; margin: 0 auto; padding: 14px 18px 0; display: flex; gap: 5px; }

.rail-lab.now { color: var(--amber); }

.wrap { max-width: 940px; margin: 0 auto; padding: 22px 18px 0; }
.docket { background: var(--panel); color: var(--ink); border-radius: 3px; border: 1px solid var(--panel2); box-shadow: 0 18px 44px rgba(0,0,0,0.4); overflow: hidden; animation: slidein 320ms ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.docket-head { padding: 16px 22px; border-bottom: 2px dashed var(--panel2); display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.docket-head .num { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; background: var(--ink); color: var(--amber); padding: 5px 9px; border-radius: 2px; white-space: nowrap; }

.docket-foot { padding: 13px 22px; border-top: 2px dashed var(--panel2); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: 'Space Mono', monospace; font-size: 11px; color: #6c6154; letter-spacing: 0.06em; }

.btn { border: none; border-radius: 2px; padding: 12px 22px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 14.5px; transition: transform 90ms ease, filter 120ms ease; }

.btn-go { background: var(--ink); color: var(--amber); }

.btn-lite { background: var(--amber); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.opts { display: grid; gap: 9px; }
.opt { width: 100%; text-align: left; background: #fff; color: var(--ink); border: 1.5px solid var(--panel2); border-radius: 3px; padding: 13px 15px; font-size: 14.5px; line-height: 1.45; display: flex; gap: 12px; align-items: flex-start; transition: border-color 110ms ease, background 110ms ease; }
.opt:hover:not(:disabled) { border-color: var(--ink); background: #fffdf7; }
.opt .key { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; background: var(--panel2); color: #5c5245; border-radius: 2px; padding: 3px 7px; flex: none; margin-top: 1px; }
.opt.right { border-color: var(--teal); background: #eef7f4; }
.opt.right .key { background: var(--teal); color: #fff; }
.opt.wrong { border-color: var(--rust); background: #fbefeb; }
.opt.wrong .key { background: var(--rust); color: #fff; }
.opt.sel { border-color: var(--ink); background: #fffdf7; }
.opt.sel .key { background: var(--ink); color: var(--amber); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #fff; border: 1.5px solid var(--panel2); border-radius: 999px; padding: 9px 15px; font-size: 13.5px; color: var(--ink); font-weight: 500; }
.chip:hover:not(:disabled) { border-color: var(--ink); }
.chip.right { border-color: var(--teal); background: #eef7f4; }
.chip.wrong { border-color: var(--rust); background: #fbefeb; }

.stamp { display: inline-block; transform: rotate(-6deg); font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.16em; padding: 6px 14px; border: 3px solid currentColor; border-radius: 3px; animation: thump 260ms cubic-bezier(.2,1.6,.4,1); }
@keyframes thump { from { transform: rotate(-6deg) scale(1.7); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.stamp.ok { color: var(--teal); }
.stamp.no { color: var(--rust); }

.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 3px; background: var(--panel2); border-left: 4px solid var(--ink); font-size: 14px; color: #45403a; }
.feedback strong { color: var(--ink); }
.metaline { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a6f60; }
.qtext { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 0 0 16px; font-family: 'Archivo', sans-serif; letter-spacing: -0.01em; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { padding: 20px 16px; border-radius: 3px; border: 2px solid var(--ink); background: #fff; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.bin span { font-family: 'Public Sans', sans-serif; font-weight: 400; font-size: 12px; color: #6c6154; }
.bin:hover:not(:disabled) { background: var(--amber); }
.card-item { background: #fff; border: 1.5px solid var(--panel2); border-left: 5px solid var(--amber); border-radius: 3px; padding: 20px; font-size: 17px; line-height: 1.4; margin-bottom: 16px; font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--panel2); vertical-align: top; }
.tbl th { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7a6f60; }
.tbl td.num { font-family: 'Space Mono', monospace; }
.supbox { background: #fff; border: 1.5px solid var(--panel2); border-radius: 3px; padding: 14px 16px; margin-bottom: 10px; }
.ta { width: 100%; min-height: 260px; resize: vertical; padding: 15px; border: 1.5px solid var(--panel2); border-radius: 3px; background: #fff; color: var(--ink); font-family: 'Public Sans', sans-serif; font-size: 15px; line-height: 1.65; }
.inp { padding: 11px 13px; border: 1.5px solid var(--panel2); border-radius: 3px; background: #fff; color: var(--ink); font-size: 14.5px; font-family: inherit; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: #fff; border: 1.5px solid var(--panel2); border-radius: 3px; margin-bottom: 8px; font-size: 14px; text-align: left; width: 100%; color: var(--ink); line-height: 1.45; }
.check.on { border-color: var(--teal); background: #eef7f4; }
.check .box { width: 20px; height: 20px; flex: none; border: 2px solid var(--ink); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; margin-top: 1px; }
.check.on .box { background: var(--teal); border-color: var(--teal); color: #fff; }
.ordrow { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1.5px solid var(--panel2); border-radius: 3px; padding: 11px 13px; margin-bottom: 8px; font-size: 14px; color: var(--ink); }
.ordrow.right { border-color: var(--teal); background: #eef7f4; }
.ordrow.wrong { border-color: var(--rust); background: #fbefeb; }
.ordbtns { display: flex; flex-direction: column; gap: 3px; flex: none; }
.ordbtns button { width: 26px; height: 20px; border: 1px solid var(--panel2); background: var(--panel); border-radius: 2px; font-size: 11px; line-height: 1; color: var(--ink); }
.ordbtns button:hover:not(:disabled) { background: var(--amber); }
.ordnum { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; color: #7a6f60; flex: none; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.statbox { background: #fff; border: 1.5px solid var(--panel2); border-radius: 3px; padding: 14px; }
.statbox .k { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: #7a6f60; }
.statbox .v { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px; margin-top: 2px; }
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.badge { display: inline-block; background: var(--ink); color: var(--amber); border-radius: 999px; padding: 6px 14px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.09em; margin: 0 6px 6px 0; }
.note { font-size: 13px; color: #6c6154; }
details.teach { background: var(--ink2); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; margin-top: 16px; color: var(--panel); }
details.teach summary { cursor: pointer; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 14px; }
details.teach ul { margin: 12px 0 0; padding-left: 20px; font-size: 13.5px; color: #c8d3ce; }
details.teach li { margin-bottom: 6px; }
.rowbtn { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }

@media (max-width: 620px) {
  .bins { grid-template-columns: 1fr; }
  .docket-head h2 { font-size: 21px; }
  .gauge .val { font-size: 16px; }
  .docket-body { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

<script>

 "Societal attitudes and behaviour","Economic conditions","Technological developments","Global considerations","Corporate social responsibility"];

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(sec){ return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function totalPoints(){ return ROUNDS.reduce(function(s,r){ return s + ((S.results[r.id]&&S.results[r.id].points)||0); },0); }
function shuffle(arr){
 var a = arr.slice();
 for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
 var same = a.every(function(v,i){ return v===arr[i]; });
 if (same){ var t2=a[0]; a[0]=a[1]; a[1]=t2; }
 return a;
}
function stamp(ok){ return '<span class="stamp '+(ok?"ok":"no")+'">'+(ok?"CLEARED":"HELD")+'</span>'; }
function docket(num,title,sub,body,foot){
 return '<div class="docket"><div class="docket-head"><div class="num">'+esc(num)+'</div>'+
  '<div style="flex:1;min-width:220px"><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div></div>'+
  '<div class="docket-body">'+body+'</div>'+
  (foot?'<div class="docket-foot">'+foot+'</div>':'')+'</div>';
}
function optList(opts, picked, answer, extra){
 return '<div class="opts">'+opts.map(function(o,i){
  var cls="opt";
  if (extra && extra.sel && extra.sel.indexOf(i)>-1 && !extra.locked) cls+=" sel";
  if (picked!==null && picked!==undefined){
   var good = (extra && extra.correctSet) ? extra.correctSet.indexOf(i)>-1 : i===answer;
   if (good) cls+=" right";
   else if (Array.isArray(picked) ? picked.indexOf(i)>-1 : i===picked) cls+=" wrong";
  }
  var dis = (picked!==null && picked!==undefined) ? " disabled" : "";
  return '<button class="'+cls+'" data-act="'+extra.act+'" data-i="'+i+'"'+dis+'>'+
   '<span class="key">'+KEYS[i]+'</span><span>'+esc(o)+'</span></button>';
 }).join("")+'</div>';
}

  '<div class="grid2" style="margin-bottom:20px">'+
   '<div class="statbox"><div class="k">Total score</div><div class="v">'+total+' <span style="font-size:15px;color:#7a6f60">/ '+TOTAL_MAX+'</span></div></div>'+
   '<div class="statbox"><div class="k">Percentage</div><div class="v">'+Math.round(ratio*100)+'%</div></div>'+
   '<div class="statbox"><div class="k">Time on task</div><div class="v mono">'+fmt(S.elapsed)+'</div></div>'+
  '</div>'+
  '<div class="metaline" style="margin-bottom:10px">Round by round</div>'+
  ROUNDS.map(function(r){
   var p = (S.results[r.id]&&S.results[r.id].points)||0;
   return '<div style="margin-bottom:12px"><div class="rowbtn"><span>'+esc(r.name)+'</span><span class="mono">'+p+' / '+r.max+'</span></div>'+
    '<div class="bar"><i style="width:'+Math.min(100,(p/r.max)*100)+'%"></i></div></div>';
  }).join("");

 if (badges.length){
  body += '<div class="metaline" style="margin:20px 0 10px">Stamps earned</div><div>'+
   badges.map(function(b){ return '<span class="badge">'+esc(b)+'</span>'; }).join("")+'</div>';
 }
 if (w.essay){
  body += '<div class="metaline" style="margin:20px 0 8px">Your written response ('+w.words+' words, '+w.rubric+' of '+RUBRIC.length+' self-checks)</div>'+
   '<div class="supbox" style="white-space:pre-wrap;font-size:14px;line-height:1.6">'+esc(w.essay)+'</div>'+
   '<p class="note">Copy this into your workbook before you close the page. Nothing here is saved.</p>';
 }
 body += '<div class="metaline" style="margin:24px 0 10px">Class board</div>'+
  '<p class="note" style="margin-top:0">This board lives on this device for this session only. Refreshing clears it.</p>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
   '<input class="inp" id="nameinp" placeholder="Your name" value="'+esc(S.res.name)+'" style="flex:1;min-width:180px">'+
   '<button class="btn btn-lite" data-act="res-add"'+(S.res.added?" disabled":"")+'>'+(S.res.added?"Added":"Add my score")+'</button>'+
  '</div>';
 if (S.board.length){
  var sorted = S.board.slice().sort(function(a,b){ return b.total-a.total; });
  body += '<table class="tbl"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody>'+
   sorted.map(function(b,i){
    return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(b.name)+'</td><td class="num">'+b.total+
     '</td><td class="num">'+b.pct+'%</td><td class="num">'+fmt(b.time)+'</td></tr>';
   }).join("")+'</tbody></table>';
 }
 body += '<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">'+
  '<button class="btn btn-go" data-act="res-copy">'+(S.res.copied?"Copied":"Copy my result")+'</button>'+
  '<button class="btn btn-ghost" data-act="res-restart">Run it again</button></div>';

 return docket("DISPATCH COMPLETE", esc(tier.name), esc(tier.note), body);
}

/* ====================== RENDER ====================== */

function renderRail(){
 var el=document.getElementById("rail");
 if (S.stage==="intro"){ el.innerHTML=""; return; }
 el.innerHTML = '<div class="rail">'+ROUNDS.map(function(r,i){
  var c = (i<S.ri || S.stage==="done") ? "done" : (i===S.ri ? "now" : "");
  return '<div class="rail-seg"><div class="rail-bar '+c+'"></div>'+
   '<div class="rail-lab'+((i===S.ri&&S.stage==="run")?" now":"")+'">'+(i+1)+'</div></div>';
 }).join("")+'</div>';
}

function renderGauges(){
 document.getElementById("gScore").textContent = totalPoints();
 document.getElementById("gRound").textContent = S.stage==="run" ? (S.ri+1)+"/6" : (S.stage==="done" ? "6/6" : "-");
 document.getElementById("gTime").textContent = fmt(S.elapsed);
}

function render(){
 var html;
 if (S.stage==="intro") html = viewIntro();
 else if (S.stage==="done") html = viewResults();
 else {
  var id = ROUNDS[S.ri].id;
  html = id==="sprint" ? viewSprint()
    : id==="sort" ? viewSort()
    : id==="factor" ? viewFactor()
    : id==="supplier" ? viewSupplier()
    : id==="chain" ? viewChain()
    : viewWrite();
 }
 document.getElementById("app").innerHTML = html;
 renderRail();
 renderGauges();
 bindEssay();
}

function bindEssay(){
 var ta = document.getElementById("essay");
 if (!ta) return;
 ta.addEventListener("input", function(){
  S.wr.essay = ta.value;
  var n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
  var wc = document.getElementById("wordcount"); if (wc) wc.textContent = n;
  var btn = document.getElementById("submitBtn");
  if (btn){
   btn.disabled = n < 40;
   btn.textContent = n<40 ? "Write at least 40 words to submit" : "Submit and see results";
  }
 });
}

/* ====================== TIMERS ====================== */

function startElapsed(){
 if (elapsedTimer) return;
 elapsedTimer = setInterval(function(){
  S.elapsed++;
  var el=document.getElementById("gTime"); if (el) el.textContent = fmt(S.elapsed);
 },1000);
}
function stopElapsed(){ clearInterval(elapsedTimer); elapsedTimer=null; }

function startSprintClock(){
 stopSprintClock();
 sprintTimer = setInterval(function(){
  if (S.sp.picked!==null){ stopSprintClock(); return; }
  S.sp.left--;
  if (S.sp.left<=0){
   stopSprintClock();
   S.sp.picked = -1; S.sp.streak = 0; S.sp.bonus = 0;
   render();
   return;
  }
  var el=document.getElementById("spclock");
  if (el){ el.textContent = S.sp.left+"s"; if (S.sp.left<=5) el.style.color="#b24a2e"; }
 },1000);
}
function stopSprintClock(){ clearInterval(sprintTimer); sprintTimer=null; }

/* ====================== ROUND COMPLETION ====================== */

function finishRound(id, payload){
 S.results[id] = payload;
 if (S.ri+1 >= ROUNDS.length){ S.stage="done"; stopElapsed(); }
 else { S.ri++; }
 render();
 if (S.stage==="run" && ROUNDS[S.ri].id==="sprint") startSprintClock();
}

/* ====================== EVENTS ====================== */

document.getElementById("app").addEventListener("click", function(ev){
 var btn = ev.target.closest("[data-act]");
 if (!btn || btn.disabled) return;
 var act = btn.getAttribute("data-act");
 var i = parseInt(btn.getAttribute("data-i"),10);

 if (act==="start"){ S.stage="run"; startElapsed(); render(); startSprintClock(); return; }

 /* Round 1 */
 if (act==="sp-ans"){
  var st=S.sp, q=SPRINT[st.i];
  if (st.picked!==null) return;
  stopSprintClock();
  var ok = i===q.a;
  st.bonus = ok ? Math.min(4, Math.ceil(st.left/5)) : 0;
  if (ok){ st.pts += 10 + st.bonus; st.correct++; st.streak++; st.best=Math.max(st.best,st.streak); }
  else st.streak = 0;
  st.picked = i; render(); return;
 }
 if (act==="sp-next"){
  var s1=S.sp;
  if (s1.i+1>=SPRINT.length){ finishRound("sprint",{points:s1.pts,correct:s1.correct,of:SPRINT.length,best:s1.best}); return; }
  s1.i++; s1.picked=null; s1.left=20; s1.bonus=0; render(); startSprintClock(); return;
 }

 /* Round 2 */
 if (act==="so-bin"){
  var s2=S.so, it=SORT_ITEMS[s2.i];
  if (s2.picked) return;
  var v=btn.getAttribute("data-v");
  if (v===it.cat){ s2.pts+=8; s2.correct++; }
  s2.picked=v; render(); return;
 }
 if (act==="so-next"){
  var s2b=S.so;
  if (s2b.i+1>=SORT_ITEMS.length){ finishRound("sort",{points:s2b.pts,correct:s2b.correct,of:SORT_ITEMS.length}); return; }
  s2b.i++; s2b.picked=null; render(); return;
 }

 /* Round 3 */
 if (act==="fa-chip"){
  var s3=S.fa, it3=FACTOR_ITEMS[s3.i];
  if (s3.picked!==null) return;
  if (i===it3.a){ s3.pts+=15; s3.correct++; }
  s3.picked=i; render(); return;
 }
 if (act==="fa-next"){
  var s3b=S.fa;
  if (s3b.i+1>=FACTOR_ITEMS.length){ finishRound("factor",{points:s3b.pts,correct:s3b.correct,of:FACTOR_ITEMS.length}); return; }
  s3b.i++; s3b.picked=null; render(); return;
 }

 /* Round 4 */
 if (act==="su-opt"){
  var s4=S.su, d=SUPPLIER_DECISIONS[s4.i];
  if (s4.locked) return;
  if (!d.multi){
   s4.earned = d.pts[i]; s4.pts += s4.earned; s4.sel=[i]; s4.locked=true; render(); return;
  }
  var k = s4.sel.indexOf(i);
  if (k>-1) s4.sel.splice(k,1);
  else if (s4.sel.length < d.multi) s4.sel.push(i);
  render(); return;
 }
 if (act==="su-lock"){
  var s4b=S.su, d2=SUPPLIER_DECISIONS[s4b.i];
  var hits = s4b.sel.filter(function(x){ return d2.correct.indexOf(x)>-1; }).length;
  s4b.earned = hits===2?20:(hits===1?10:0);
  s4b.pts += s4b.earned; s4b.locked=true; render(); return;
 }
 if (act==="su-next"){
  var s4c=S.su;
  if (s4c.i+1>=SUPPLIER_DECISIONS.length){ finishRound("supplier",{points:s4c.pts,of:SUPPLIER_DECISIONS.length}); return; }
  s4c.i++; s4c.sel=[]; s4c.locked=false; s4c.earned=0; render(); return;
 }

 /* Round 5 */
 if (act==="ch-opt"){
  var s5=S.ch, step=CHAIN_EVENTS[s5.e].steps[s5.s];
  if (s5.picked!==null) return;
  if (i===step.a){ s5.pts+=15; s5.correct++; }
  s5.picked=i; render(); return;
 }
 if (act==="ch-next"){
  var s5b=S.ch, ev5=CHAIN_EVENTS[s5b.e];
  if (s5b.s+1<ev5.steps.length){ s5b.s++; s5b.picked=null; render(); return; }
  if (s5b.e+1<CHAIN_EVENTS.length){ s5b.e++; s5b.s=0; s5b.picked=null; render(); return; }
  finishRound("chain",{points:s5b.pts,correct:s5b.correct,of:CHAIN_EVENTS.length*3}); return;
 }

 /* Round 6 */
 if (act==="wr-move"){
  var s6=S.wr;
  if (s6.checked) return;
  var dir = parseInt(btn.getAttribute("data-d"),10);
  var j=i+dir;
  if (j<0||j>=s6.order.length) return;
  var t=s6.order[i]; s6.order[i]=s6.order[j]; s6.order[j]=t;
  render(); return;
 }
 if (act==="wr-check"){
  var s6b=S.wr, task=ORDER_TASKS[s6b.phase];
  var hits6 = s6b.order.filter(function(l,idx){ return l===task.correct[idx]; }).length;
  s6b.pts += hits6*6; s6b.checked=true; render(); return;
 }
 if (act==="wr-next"){
  var s6c=S.wr;
  if (s6c.phase===0){ s6c.phase=1; s6c.order=shuffle(ORDER_TASKS[1].correct); s6c.checked=false; }
  else { s6c.phase=2; }
  render(); return;
 }
 if (act==="wr-rubric"){
  var s6d=S.wr;
  var ta=document.getElementById("essay"); if (ta) s6d.essay=ta.value;
  var k6=s6d.rubric.indexOf(i);
  if (k6>-1) s6d.rubric.splice(k6,1); else s6d.rubric.push(i);
  render(); return;
 }
 if (act==="wr-finish"){
  var s6e=S.wr;
  var ta2=document.getElementById("essay"); if (ta2) s6e.essay=ta2.value;
  var words = s6e.essay.trim() ? s6e.essay.trim().split(/\s+/).length : 0;
  finishRound("write",{points:s6e.pts + s6e.rubric.length*10, essay:s6e.essay, rubric:s6e.rubric.length, words:words});
  return;
 }

 /* Results */
 if (act==="res-add"){
  var inp=document.getElementById("nameinp");
  var nm = inp ? inp.value.trim() : "";
  if (!nm) return;
  var tot=totalPoints();
  S.res.name=nm; S.res.added=true;
  S.board.push({name:nm,total:tot,pct:Math.round(tot/TOTAL_MAX*100),time:S.elapsed});
  render(); return;
 }
 if (act==="res-copy"){
  var tot2=totalPoints();
  var text = BUSINESS+": Dispatch result\n"+
   "Name: "+(S.res.name||"(unnamed)")+"\n"+
   "Score: "+tot2+" of "+TOTAL_MAX+" ("+Math.round(tot2/TOTAL_MAX*100)+"%)\n"+
   "Time: "+fmt(S.elapsed)+"\n"+
   ROUNDS.map(function(r){ return r.name+": "+((S.results[r.id]&&S.results[r.id].points)||0)+"/"+r.max; }).join("\n");
  copyText(text);
  S.res.copied=true; render();
  setTimeout(function(){ S.res.copied=false; if (S.stage==="done") render(); },2200);
  return;
 }
 if (act==="res-restart"){
  var keepBoard=S.board;
  stopElapsed(); stopSprintClock();
  S = freshState(); S.board=keepBoard;
  S.wr.order = shuffle(ORDER_TASKS[0].correct);
  render(); return;
 }
});

function copyText(text){
 if (navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
 } else fallbackCopy(text);
}
function fallbackCopy(text){
 var ta=document.createElement("textarea");
 ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
 document.body.appendChild(ta); ta.select();
 try { document.execCommand("copy"); } catch(e){}
 document.body.removeChild(ta);
}

/* ====================== BOOT ====================== */
S.wr.order = shuffle(ORDER_TASKS[0].correct);
render();
</script>
</body>
</html>
